<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>GitHub 三角徽标</title>
  <style>
    /* ===== 基础重置 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0d1117;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ===== 右上角三角徽标容器 ===== */
    .github-corner {
      position: fixed;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      z-index: 9999;
      cursor: pointer;
      overflow: hidden;

      /* 三角形：用 border 裁剪实现 */
      border-style: solid;
      border-width: 0 80px 80px 0; /* 上 右 下 左 */
      border-color: transparent #238636 transparent transparent;

      /* 初始状态：缩放为 0（从右上角缩放） */
      transform-origin: top right;
      transform: scale(0);

      /* 展示动画 */
      animation:
        cornerIn  0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards,
        cornerOut 0.4s cubic-bezier(0.36, 0, 0.66, -0.56) 2.7s forwards;
    }

    /* ===== 三角内的 GitHub Octocat 图标 ===== */
    .github-corner svg {
      position: absolute;
      top: 2px;
      right: -74px;
      width: 40px;
      height: 40px;
      fill: #fff;
      transform: rotate(0deg);
      pointer-events: none;
      
      /* 图标跟随容器动画 */
      animation:
        iconIn  0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both,
        iconOut 0.4s cubic-bezier(0.36, 0, 0.66, -0.56) 2.7s forwards;
    }

    /* ===== 展开动画 ===== */
    @keyframes cornerIn {
      from {
        transform: scale(0);
        border-width: 0 0px 0px 0;
      }
      to {
        transform: scale(1);
        border-width: 0 80px 80px 0;
      }
    }

    /* ===== 收回动画 ===== */
    @keyframes cornerOut {
      from {
        transform: scale(1);
        border-width: 0 80px 80px 0;
      }
      to {
        transform: scale(0);
        border-width: 0 0px 0px 0;
      }
    }

    @keyframes iconIn {
      from { opacity: 0; transform: scale(0) rotate(-45deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes iconOut {
      from { opacity: 1; transform: scale(1) rotate(0deg); }
      to   { opacity: 0; transform: scale(0) rotate(45deg); }
    }

    /* ===== 悬停时触角抖动 ===== */
    .github-corner:hover svg {
      animation: octocat-wave 560ms ease-in-out,
                 iconOut 0.4s cubic-bezier(0.36, 0, 0.66, -0.56) 2.7s forwards;
    }

    @keyframes octocat-wave {
      0%, 100% { transform: rotate(0deg); }
      20%, 60% { transform: rotate(-20deg); }
      40%, 80% { transform: rotate(10deg); }
    }

    /* ===== 页面内容（模拟 GitHub） ===== */
    .page-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #e6edf3;
      gap: 16px;
    }

    .page-content h1 {
      font-size: 2rem;
      color: #58a6ff;
    }

    .page-content p {
      color: #8b949e;
      font-size: 0.95rem;
    }

    .replay-btn {
      margin-top: 24px;
      padding: 8px 20px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .replay-btn:hover { background: #2ea043; }
  </style>
</head>
<body>

    </svg>
    <h1>GitHub</h1>
    <p>右上角三角徽标将在页面加载后展示 2 秒，然后自动收回</p>
    <button class="replay-btn" onclick="replayAnimation()">🔄 重新播放</button>
  </div>

  <script>
    // ===== 重新播放动画 =====
    function replayAnimation() {
      const corner = document.getElementById('corner');

      // 移除元素后重新插入，触发动画重置
      const clone = corner.cloneNode(true);
      corner.parentNode.replaceChild(clone, corner);

      // 重新绑定点击事件（跳转 GitHub）
      document.getElementById('corner').addEventListener('click', () => {
        window.open('https://github.com', '_blank');
      });
    }

    // ===== 点击跳转 GitHub =====
    document.getElementById('corner').addEventListener('click', () => {
      window.open('https://github.com', '_blank');
    });
  </script>

</body>
